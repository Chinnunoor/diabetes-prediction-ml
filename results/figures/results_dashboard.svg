    <text x="955" y="677" font-size="16" font-weight="700" fill="#17324d">Evidence notes</text>
    <text x="955" y="712" font-size="14" fill="#344956">• ROC-AUC was not computed in the</text><text x="975" y="733" font-size="14" fill="#344956">preserved notebook outputs.</text>
    <text x="955" y="770" font-size="14" fill="#344956">• SMOTE class metrics were not stored</text><text x="975" y="791" font-size="14" fill="#344956">for the separate accuracy experiment.</text>
    <text x="955" y="828" font-size="14" fill="#344956">• Results are exploratory and split-specific.</text>
